# Shared training budget B (decided 2026-11-22): identical for MTGNN (S4) and every S5 version. A small grid, not a
# search, so the single validation year is not overfitted. Each grid point is chosen at seed 0 on 2023, the best
# point is then scored over 5 seeds.
grid:
  hidden: [32, 64]
  dropout: [0.0, 0.2]
lr: 0.003
weight_decay: 0.0001
max_epochs: 100
patience: 20          # stop tuning after 20 epochs without a better 2023 score
