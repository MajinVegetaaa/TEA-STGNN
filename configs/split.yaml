# Temporal split for the 2019-2023 data (decided 2026-10-15). Never tune on the test year.
# Everyone reads years from here. Row year = target year; features come from earlier years only,
# so 2019 rows (no history) can't be forecasting targets and in practice training targets are 2020-2021.
train_years: [2019, 2020, 2021]
val_years: [2022]
test_years: [2023]
seeds: [0, 1, 2, 3, 4]
